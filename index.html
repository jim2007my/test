<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>اتجاه القبلة - رفيق المسلم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        body {
            font-family: 'Cairo', sans-serif; background: #F4F6F5; min-height: 100vh; color: #2C3E35;
            position: relative; overflow-x: hidden; display: flex; align-items: center; justify-content: center;
            padding-bottom: calc(75px + env(safe-area-inset-bottom, 0px)) !important;
        }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" opacity="0.02"><path fill="none" stroke="%232C3E35" stroke-width="1" d="M400 50 L450 150 L550 150 L475 225 L500 325 L400 275 L300 325 L325 225 L250 150 L350 150 Z M400 50 L400 275 M475 225 L325 225 M500 325 L300 325 M450 150 L350 150"/><circle cx="400" cy="400" r="80" stroke="%232C3E35" fill="none"/><circle cx="400" cy="400" r="120" stroke="%232C3E35" fill="none" stroke-dasharray="5 5"/></svg>');
            pointer-events: none; z-index: 0;
        }

        .bg-glow {
            position: fixed; width: 300px; height: 300px; background: rgba(44, 62, 53, 0.08);
            border-radius: 50%; filter: blur(100px); z-index: 0; bottom: -50px; left: -80px;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }
        .bg-glow.right { top: -80px; right: -80px; left: auto; bottom: auto; background: rgba(184, 155, 94, 0.08); animation-delay: -6s; }
        @keyframes floatGlow { 0% { transform: translate(0, 0) scale(1); opacity: 0.6; } 100% { transform: translate(15px, 30px) scale(1.1); opacity: 1; } }

        .container { width: 100%; max-width: 480px; margin: 0 auto; padding: 20px 15px; position: relative; z-index: 5; animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.9); padding: 35px 20px;
            box-shadow: 0 16px 40px -10px rgba(44, 62, 53, 0.06); text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        .header-title { font-size: 1.8rem; font-weight: 900; color: #1A2B22; letter-spacing: -0.5px; margin-bottom: 5px; }
        
        .status-badge {
            background: rgba(234, 236, 235, 0.8); padding: 8px 18px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 700; color: #4A5D53; border: 1px solid rgba(44, 62, 53, 0.05);
            transition: all 0.4s ease; display: inline-flex; align-items: center; gap: 8px;
        }
        .status-badge.success { background: rgba(184, 155, 94, 0.15); color: #8A6D3B; border-color: rgba(184, 155, 94, 0.3); box-shadow: 0 4px 15px rgba(184, 155, 94, 0.2); }

        /* ----- تصميم البوصلة ----- */
        .compass-wrapper {
            position: relative; width: 280px; height: 280px; margin: 25px auto;
            border-radius: 50%; background: #F4F6F5;
            box-shadow: inset 0 0 20px rgba(44, 62, 53, 0.05), 0 15px 35px rgba(0,0,0,0.06);
            border: 6px solid #FFFFFF; display: flex; align-items: center; justify-content: center;
            transition: all 0.4s ease;
        }

        /* تأثير الإضاءة عند الوصول للقبلة */
        .compass-wrapper.correct {
            border-color: #B89B5E;
            box-shadow: inset 0 0 30px rgba(184, 155, 94, 0.15), 0 0 40px rgba(184, 155, 94, 0.3);
            transform: scale(1.02);
        }

        /* مؤشرات الاتجاهات (شمال، جنوب..) */
        .compass-dial {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            transition: transform 0.1s linear; /* حركة البوصلة */
        }

        .compass-mark { position: absolute; font-weight: 900; color: rgba(44, 62, 53, 0.4); font-size: 1.3rem; transform: translate(-50%, -50%); }
        .mark-n { top: 20px; left: 50%; color: #A5281B; } /* الشمال بلون مميز */
        .mark-e { top: 50%; right: 5px; }
        .mark-s { bottom: 0px; left: 50%; }
        .mark-w { top: 50%; left: 20px; }

        /* سهم القبلة الداخلي */
        .qibla-arrow-container { position: absolute; width: 100%; height: 100%; transition: transform 0.1s linear; z-index: 10; }

        .qibla-pointer {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        /* أيقونة الكعبة */
        .kaaba-icon {
            width: 42px; height: 48px; background: #1A2B22; border-radius: 4px; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .kaaba-icon::before { content: ''; position: absolute; top: 12px; left: 0; width: 100%; height: 4px; background: #B89B5E; }
        
        .guide-line { width: 3px; height: 80px; background: linear-gradient(to bottom, #B89B5E, transparent); margin-top: 5px; border-radius: 2px; }

        /* زر البدء */
        .start-btn {
            background: #1A2B22; color: white; border: none; padding: 16px 35px; border-radius: 24px;
            font-size: 1.1rem; font-weight: 800; font-family: 'Cairo', sans-serif;
            box-shadow: 0 10px 25px rgba(26, 43, 34, 0.2); cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; gap: 10px; margin-top: 15px; width: 100%; justify-content: center;
        }
        .start-btn:active { transform: scale(0.95); }

        /* الشريط السفلي */
        .bottom-nav-fixed {
            position: fixed !important; bottom: 0 !important; left: 0; right: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); 
            border-top: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 -10px 30px rgba(44, 62, 53, 0.04);
            z-index: 99999 !important; padding: 8px 8px calc(24px + env(safe-area-inset-bottom, 0px)) !important;
            transform: translate3d(0, 0, 0) !important; 
        }
        .nav-inner { max-width: 520px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; gap: 2px; }
        .nav-item-bottom {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 4px; text-decoration: none; color: #8C9E95; background: transparent; border-radius: 16px;
            padding: 6px 0; transition: all 0.2s ease; font-family: 'Cairo', sans-serif;
        }
        .nav-item-bottom i { font-size: 1.15rem; transition: transform 0.2s; }
        .nav-item-bottom span { font-weight: 600; font-size: 0.6rem; letter-spacing: -0.2px; opacity: 0.9; }
        .nav-item-bottom.active { color: #2C3E35; }
        .nav-item-bottom.active i { color: #B89B5E; transform: translateY(-2px); font-size: 1.25rem;}
        .nav-item-bottom.active span { color: #1A2B22; font-weight: 800; }

        @media (max-width: 480px) {
            .compass-wrapper { width: 240px; height: 240px; }
            .bottom-nav-fixed { padding: 8px 10px calc(24px + env(safe-area-inset-bottom, 0px)) !important; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow right"></div>

    <div class="container">
        <div class="glass-card">
            
            <h1 class="header-title">اتجاه القبلة</h1>
            <div id="status-message" class="status-badge"><i class="fas fa-location-arrow"></i> اضغط لتحديد الموقع وبدء البوصلة</div>

            <button id="start-btn" class="start-btn">
                <i class="fas fa-location-crosshairs"></i> تحديد القبلة الآن
            </button>

            <div id="compass-ui" style="display: none; width: 100%;">
                <div id="compass-wrapper" class="compass-wrapper">
                    <div id="compass-dial" class="compass-dial">
                        <div class="compass-mark mark-n">N</div>
                        <div class="compass-mark mark-e">E</div>
                        <div class="compass-mark mark-s">S</div>
                        <div class="compass-mark mark-w">W</div>
                    </div>
                    <div id="qibla-arrow" class="qibla-arrow-container">
                        <div class="qibla-pointer">
                            <div class="kaaba-icon"></div>
                            <div class="guide-line"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="bottom-nav-fixed">
        <div class="nav-inner">
            <a href="index.html" class="nav-item-bottom">
                <i class="fas fa-home"></i><span>الرئيسية</span>
            </a>
            <a href="quran.html" class="nav-item-bottom">
                <i class="fas fa-book-open"></i><span>المصحف</span>
            </a>
            <a href="azkar.html" class="nav-item-bottom">
                <i class="fas fa-hands-praying"></i><span>الأذكار</span>
            </a>
            <a href="qibla.html" class="nav-item-bottom active">
                <i class="fas fa-kaaba"></i><span>القبلة</span>
            </a>
            <a href="prayer.html" class="nav-item-bottom">
                <i class="fas fa-mosque"></i><span>مواقيت</span>
            </a>
        </div>
    </div>

    <script>
        // إحداثيات الكعبة المشرفة الدقيقة
        const MECCA_LAT = 21.422487;
        const MECCA_LNG = 39.826206;

        let userLat = null;
        let userLng = null;
        let qiblaAngle = 0;

        const startBtn = document.getElementById('start-btn');
        const statusMsg = document.getElementById('status-message');
        const compassUI = document.getElementById('compass-ui');
        const compassDial = document.getElementById('compass-dial');
        const qiblaArrow = document.getElementById('qibla-arrow');
        const compassWrapper = document.getElementById('compass-wrapper');

        // حساب الزاوية الهندسية للقبلة بناءً على موقع الموبايل
        function calculateQibla(lat, lng) {
            const PI = Math.PI;
            const latK = MECCA_LAT * PI / 180.0;
            const lngK = MECCA_LNG * PI / 180.0;
            const phi = lat * PI / 180.0;
            const lambda = lng * PI / 180.0;
            
            const y = Math.sin(lngK - lambda);
            const x = Math.cos(phi) * Math.tan(latK) - Math.sin(phi) * Math.cos(lngK - lambda);
            
            let qibla = Math.atan2(y, x) * 180.0 / PI;
            return (qibla + 360) % 360; 
        }

        // بدء التشغيل
        startBtn.addEventListener('click', () => {
            statusMsg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تحديد الموقع...';
            startBtn.style.display = 'none';

            // 1. طلب الموقع (GPS)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;
                        qiblaAngle = calculateQibla(userLat, userLng);
                        
                        statusMsg.innerHTML = '<i class="fas fa-sync"></i> لُف الموبايل على شكل رقم 8 لمعايرة البوصلة';
                        statusMsg.classList.remove('success');
                        compassUI.style.display = 'block';
                        
                        // 2. طلب تفعيل البوصلة
                        initCompass();
                    },
                    (error) => {
                        statusMsg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> يرجى تفعيل الـ GPS (الموقع)';
                        startBtn.style.display = 'flex';
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                statusMsg.innerHTML = "متصفحك لا يدعم تحديد الموقع";
            }
        });

        function initCompass() {
            // طلب إذن البوصلة لأنظمة الآيفون (iOS 13+)
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            statusMsg.innerHTML = "تم رفض صلاحية البوصلة";
                        }
                    })
                    .catch(console.error);
            } else {
                // أنظمة الأندرويد
                window.addEventListener('deviceorientationabsolute', handleOrientation);
                // احتياطياً للمتصفحات الأخرى
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        let lastVibrateTime = 0;

        function handleOrientation(event) {
            let compassHeading = null;

            // استخراج الشمال الحقيقي بناءً على نظام التشغيل
            if (event.webkitCompassHeading) {
                compassHeading = event.webkitCompassHeading; // iOS
            } else if (event.absolute && event.alpha !== null) {
                compassHeading = 360 - event.alpha; // Android (Absolute)
            } else if (event.alpha !== null) {
                compassHeading = 360 - event.alpha; // Android (Fallback)
            }

            if (compassHeading !== null) {
                // تدوير القرص ليبقى الشمال ثابتاً
                compassDial.style.transform = `rotate(${-compassHeading}deg)`;
                
                // تدوير سهم الكعبة ليتجه للقبلة بدقة
                let arrowRotation = qiblaAngle - compassHeading;
                qiblaArrow.style.transform = `rotate(${arrowRotation}deg)`;

                // التحقق مما إذا كان المستخدم يواجه القبلة (هامش خطأ 4 درجات فقط!)
                let facingDiff = Math.abs(arrowRotation % 360);
                if (facingDiff > 180) facingDiff = 360 - facingDiff;

                if (facingDiff < 4) {
                    statusMsg.innerHTML = '<i class="fas fa-check-circle"></i> أنت الآن تتجه للقبلة!';
                    statusMsg.classList.add('success');
                    compassWrapper.classList.add('correct');
                    
                    // اهتزاز تكتيكي لتأكيد الاتجاه (كل 3 ثواني عشان ميزعجش المستخدم)
                    const now = Date.now();
                    if (navigator.vibrate && (now - lastVibrateTime > 3000)) {
                        navigator.vibrate([100, 50, 100]); // نبضتين كدليل على النجاح
                        lastVibrateTime = now;
                    }
                } else {
                    statusMsg.innerHTML = '<i class="fas fa-compass"></i> لُف الموبايل لحد ما الكعبة تنور';
                    statusMsg.classList.remove('success');
                    compassWrapper.classList.remove('correct');
                }
            }
        }
    </script>
</body>
</html>
