<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مليونير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ── المتغيرات ── */
        :root {
            --bg-deep: #0b0b12;
            --bg-card: rgba(18, 18, 30, 0.75);
            --border-glass: rgba(255, 255, 255, 0.06);
            --gold: #d4a847;
            --gold-light: #f0d080;
            --gold-dark: #b8923a;
            --text-primary: #f0f0f5;
            --text-secondary: #9a9ab0;
            --text-muted: #6a6a82;
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        /* ── Reset ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ── خلفية متدرجة ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(212, 168, 71, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(120, 80, 200, 0.04) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* ── جزيئات ذهبية محسنة للأداء ── */
        .particle-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
            will-change: transform;
            animation: floatParticle 15s ease-in-out infinite alternate;
        }
        .particle-glow--1 {
            width: 400px;
            height: 400px;
            background: var(--gold);
            top: -100px;
            right: -100px;
            opacity: 0.08;
        }
        .particle-glow--2 {
            width: 300px;
            height: 300px;
            background: #7c5cbf;
            bottom: -100px;
            left: -100px;
            opacity: 0.06;
            animation-delay: -7s;
        }

        @keyframes floatParticle {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(30px, -30px, 0) scale(1.1); }
        }

        /* ── الحاوية والتجاوب ── */
        .app-container {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* ── البطاقة الرئيسية (الآن تمتد بملء الشاشة) ── */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ── تغليف المحتوى الداخلي للحفاظ على التناسق ── */
        .content-wrapper {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        /* ── الهيدر ── */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, rgba(212, 168, 71, 0.12), rgba(212, 168, 71, 0.03));
            border: 1px solid rgba(212, 168, 71, 0.15);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .brand-icon svg { width: 32px; height: 32px; fill: var(--gold); }

        .brand-title {
            font-size: clamp(28px, 5vw, 36px);
            font-weight: 900;
            background: linear-gradient(to right, #fff 30%, var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 4px;
        }

        /* ── صورة الجائزة ── */
        .prize-wrapper {
            position: relative;
            margin: 0 auto 24px;
            width: 100%;
            max-width: 240px;
        }
        .prize-img {
            width: 100%;
            border-radius: 20px;
            animation: floatPrize 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.4));
            will-change: transform;
        }
        @keyframes floatPrize {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -10px, 0); }
        }

        /* ── النصوص الرئيسية ── */
        .main-title {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 900;
            margin-bottom: 8px;
            color: #fff;
        }
        .main-title .highlight { color: var(--gold); }
        .sub-title {
            font-size: clamp(14px, 2vw, 16px);
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        /* ── العداد ── */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .time-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            padding: 16px 8px;
            transition: border-color 0.3s;
        }
        .time-box:hover { border-color: rgba(212, 168, 71, 0.2); }
        .time-box span {
            display: block;
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 900;
            color: #fff;
            line-height: 1.2;
        }
        .time-box small {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ── الإحصائيات ── */
        .stats-container {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--gold-light); margin-top: 4px; display: block; }
        .stat-divider { width: 1px; background: rgba(255, 255, 255, 0.06); }

        /* ── الأزرار والعلامات ── */
        .price-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 168, 71, 0.08);
            border: 1px solid rgba(212, 168, 71, 0.2);
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .price-badge strong { font-size: 22px; color: var(--gold-light); font-weight: 900; }

        .btn-primary {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(145deg, var(--gold), var(--gold-dark));
            color: #0b0b12;
            font-size: clamp(16px, 3vw, 18px);
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 168, 71, 0.3);
        }
        .btn-primary:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }

        /* ── المودال (النافذة المنبثقة) ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open { display: flex; opacity: 1; }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 480px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.open .modal-content { transform: translateY(0); }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 16px;
        }
        .modal-title-wrap h3 { font-size: 24px; color: #fff; }
        
        .btn-close {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
        }
        .btn-close:hover { background: rgba(255,255,255,0.1); }

        /* ── الحقول ── */
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600;}
        .glass-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .glass-input:focus { border-color: var(--gold); }

        .transfer-card {
            background: rgba(212, 168, 71, 0.05);
            border: 1px dashed var(--gold);
            padding: 20px;
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
        }
        .transfer-card h2 { color: var(--gold-light); letter-spacing: 2px; }
        
        .upload-area {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            border: 1px dashed rgba(255,255,255,0.2);
            padding: 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--gold-light);
            transition: background 0.3s;
        }
        .upload-area:hover { background: rgba(255,255,255,0.05); }

        /* ── الإشعارات (Toast) ── */
        .toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show { bottom: 30px; opacity: 1; }

        /* ── الميديا كويري (الهواتف المحمولة) ── */
        @media (max-width: 600px) {
            .glass-card { padding: 30px 15px; }
            .timer-grid { gap: 8px; }
            .time-box { padding: 12px 4px; }
            .modal-content { padding: 24px 20px; }
        }
    </style>
</head>
<body>

    <div class="particle-glow particle-glow--1"></div>
    <div class="particle-glow particle-glow--2"></div>

    <div class="app-container">
        <div class="glass-card">
            
            <div class="content-wrapper">
                <div class="brand-header">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H8v2h8v-2h-3v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
                    </div>
                    <div class="brand-title">مليونير</div>
                    <div class="brand-subtitle">سحب حصري</div>
                </div>

                <div class="prize-wrapper">
                    <img class="prize-img" src="coins.png" alt="coins" />
                </div>

                <h1 class="main-title">32600 Coins</h1>
                <p class="sub-title">فرصة ذهبية – شارك وكن من المحظوظين</p>

                <div class="timer-grid">
                    <div class="time-box"><span id="days">0</span><small>يوم</small></div>
                    <div class="time-box"><span id="hours">0</span><small>ساعة</small></div>
                    <div class="time-box"><span id="minutes">0</span><small>دقيقة</small></div>
                    <div class="time-box"><span id="seconds">0</span><small>ثانية</small></div>
                </div>

                <div class="stats-container">
                    <div class="stat-item">
                        <span class="stat-label">المشتركين</span>
                        <span class="stat-value">0</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-label">المقاعد المتبقية</span>
                        <span class="stat-value">0</span>
                    </div>
                </div>

                <div class="price-badge">
                    <span>رسوم المشاركة</span> <strong>25.00 EGP</strong>
                </div>

                <button class="btn-primary" id="joinBtn" onclick="openModal()">شارك الآن – ادخل السحب</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <h3>تأكيد الاشتراك</h3>
                </div>
                <button class="btn-close" onclick="closeModal()">✕</button>
            </div>

            <div class="input-group">
                <label>📲 حول قيمة الاشتراك على هذا الرقم (اضغط للنسخ)</label>
                <div class="transfer-card" onclick="copyNumber()">
                    <h2>01229785379</h2>
                </div>
            </div>

            <div class="input-group">
                <label>رقم المحفظة المرسل منه</label>
                <input class="glass-input" id="mFromPhone" type="tel" placeholder="01XXXXXXXXX" maxlength="11" />
            </div>

            <div class="input-group">
                <label>إيصال الدفع (سكرين شوت)</label>
                <label class="upload-area">
                    📎 إرفاق صورة التحويل
                    <input type="file" id="mScreenshot" accept="image/*" style="display:none;" />
                </label>
                <div id="screenshotName" style="margin-top: 10px; font-size: 13px; color: var(--gold);"></div>
            </div>

            <button class="btn-primary" id="submitPaymentBtn" disabled>تأكيد وإرسال</button>
        </div>
    </div>

    <div class="toast" id="toast">✅ تم النسخ بنجاح</div>

    <script>
        // العداد التنازلي
        const END_DATE = new Date("2026-06-28T23:59:59").getTime();
        setInterval(() => {
            const diff = Math.max(0, END_DATE - Date.now());
            document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
            document.getElementById("minutes").innerText = Math.floor((diff / (1000 * 60)) % 60);
            document.getElementById("seconds").innerText = Math.floor((diff / 1000) % 60);
        }, 1000);

        // وظائف المودال
        const modal = document.getElementById("paymentModal");
        const mFromPhone = document.getElementById("mFromPhone");
        const mScreenshot = document.getElementById("mScreenshot");
        const submitBtn = document.getElementById("submitPaymentBtn");

        function openModal() {
            modal.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            modal.classList.remove("open");
            document.body.style.overflow = "";
        }

        modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
        document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

        // التحقق من المدخلات
        function validateModal() {
            const isPhoneValid = mFromPhone.value.trim().length === 11 && mFromPhone.value.startsWith("01");
            const isImageValid = mScreenshot.files.length > 0;
            submitBtn.disabled = !(isPhoneValid && isImageValid);
        }

        mFromPhone.addEventListener("input", function() {
            this.value = this.value.replace(/\D/g, "").slice(0, 11);
            validateModal();
        });

        mScreenshot.addEventListener("change", function() {
            document.getElementById("screenshotName").textContent = this.files.length ? "✅ " + this.files[0].name : "";
            validateModal();
        });

        // النسخ
        function copyNumber() {
            navigator.clipboard.writeText("01229785379").then(() => {
                const toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 2500);
            });
        }
    </script>
</body>
</html>
